---
name: Shared checks

"on":
  workflow_call:

permissions:
  contents: read

jobs:
  suite:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, aggregate]
    steps:
      - name: Checkout
        # v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Node
        # v6.0.0
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 22.23.1

      - name: Cache Bun
        # v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.bun
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks and unit tests
        if: matrix.suite == 'unit'
        run: |
          bun run format:check
          bun run lint
          bun run typecheck
          bun run test
          bun run check:pi-deps
          bun run check:upstreams

      - name: Run aggregate integration tests
        if: matrix.suite == 'aggregate'
        env:
          AGGREGATE_SMOKE_ARTIFACT_DIR: >-
            ${{ runner.temp }}/aggregate-package-smoke
        run: bun run test:aggregate

      - name: Upload aggregate smoke diagnostics
        if: failure() && matrix.suite == 'aggregate'
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aggregate-smoke-diagnostics
          path: ${{ runner.temp }}/aggregate-package-smoke/
          if-no-files-found: ignore
